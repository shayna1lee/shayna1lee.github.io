<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shayna | Modern Editorial Portfolio</title>
    <style>
        :root {
            --bg-color: #FDFBF7; /* Soft Cream */
            --text-main: #1A1A1A; /* Deep Charcoal */
            --accent: #D4AF37; /* Muted Champagne */
            --text-muted: #666666;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 480px;
            width: 100%;
            text-align: center;
            background: #ffffff;
            padding: 40px 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        /* Fixed Image Wrapper */
        .profile-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 24px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--bg-color);
            background-color: #eaeaea; /* Fallback color while image loads */
        }

        .profile-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 32px;
            line-height: 1.4;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            display: block;
            text-decoration: none;
            color: var(--text-main);
            background-color: var(--bg-color);
            padding: 16px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: transform 0.2s ease, background-color 0.2s ease;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .link-card:hover {
            transform: translateY(-2px);
            background-color: #F5F1E9;
        }

        .footer-text {
            margin-top: 40px;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- PROFILE IMAGE SECTION -->
        <div class="profile-container">
            <!-- Your exact photo filename linked perfectly below -->
            <img src="A1B15C0F-751F-43D1-4DFBB13EFF19.png" alt="Shayna">
        </div>

        <h1>@shayna1lee</h1>
        <p class="tagline">Luxury Wigs &bull; Brand Influence &bull; Digital Campaigns</p>

        <!-- LINKS SECTION -->
        <div class="links-wrapper">
            <a href="#" class="link-card">Shop Premium Units</a>
            <a href="#" class="link-card">Brand Collaborations & Media Kit</a>
            <a href="#" class="link-card">Latest App Campaigns</a>
            <a href="mailto:Shaynaleebusiness@gmail.com" class="link-card" style="color: var(--accent);">Inquiries: Shaynaleebusiness@gmail.com</a>
        </div>

        <div class="footer-text">Shayna Lee &copy; 2026</div>

    </div>

</body>
</html>
